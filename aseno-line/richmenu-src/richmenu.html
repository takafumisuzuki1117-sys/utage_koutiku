<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:"ZKG";src:url(f1.woff2) format("woff2");font-weight:900}
@font-face{font-family:"BC";src:url(f2.woff2) format("woff2");font-weight:600}
@font-face{font-family:"BC";src:url(f3.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2500px;height:1686px;overflow:hidden;background:#14181C}
.grid{display:grid;grid-template-columns:833px 833px 834px;grid-template-rows:843px 843px;width:2500px;height:1686px;gap:0}
.t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;font-family:"ZKG",sans-serif;font-weight:900;text-align:center;overflow:hidden}
.t svg{width:200px;height:200px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t .ja{font-size:120px;line-height:1.1;letter-spacing:.02em}
.t .en{font-family:"BC",sans-serif;font-weight:600;font-size:62px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
/* borders between tiles (inset so each cell keeps its exact size) */
.t::after{content:"";position:absolute;inset:0;border-right:6px solid rgba(20,24,28,.18);border-bottom:6px solid rgba(20,24,28,.18);pointer-events:none}
.t:nth-child(3n)::after{border-right:0}
.t:nth-child(n+4)::after{border-bottom:0}
.o{background:#FF7F02;color:#fff}
.s{background:#38D2EE;color:#14181C}
.k{background:#14181C;color:#fff}
.k::after{border-right-color:rgba(255,255,255,.12)!important}
.w{background:#fff;color:#14181C}
.w .en{color:#4B555C}
.w svg{color:#E26C00}
.w:nth-child(5) svg{color:#1AA6DE}
.w:nth-child(6) svg{color:#1AA6DE}
.o .ja{font-size:122px}
.pill{position:absolute;top:44px;right:44px;background:#fff;color:#E26C00;font-size:52px;padding:14px 30px;border-radius:999px;letter-spacing:.04em}
.o .en,.k .en{color:rgba(255,255,255,.9)}
.s .en{color:#14181C}
</style></head>
<body><div class="grid">

<div class="t o">
  <span class="pill">参加費無料</span>
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 7.6l3.3 2.4-1.3 3.9h-4l-1.3-3.9z"/><path d="M12 2.8v4.8M15.3 10l4.6-1.6M14 13.9l2.8 4M10 13.9l-2.8 4M8.7 10L4.1 8.4"/></svg>
  <div class="ja">無料体験申込</div>
  <div class="en">Free Trial</div>
</div>

<div class="t s">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2.4"/><path d="M3 10.5h18M8 4v6.5M16 4v6.5"/><circle cx="7.5" cy="19.2" r="1.7"/><circle cx="16.5" cy="19.2" r="1.7"/><path d="M5.5 14h1.5M17 14h1.5"/></svg>
  <div class="ja">送迎について</div>
  <div class="en">Bus &amp; Care</div>
</div>

<div class="t k">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 17h2M11 17h2"/></svg>
  <div class="ja">今月の予定</div>
  <div class="en">Schedule</div>
</div>

<div class="t w">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><path d="M7.5 10.2h9M7.5 13.3h6"/></svg>
  <div class="ja">お問い合わせ</div>
  <div class="en">Contact</div>
</div>

<div class="t w">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>
  <div class="ja" style="font-family:'BC',sans-serif;font-weight:700;font-size:150px;letter-spacing:.03em">Instagram</div>
  <div class="en">@aseno_sc</div>
</div>

<div class="t w">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg>
  <div class="ja">ホームページ</div>
  <div class="en">Website</div>
</div>

</div></body></html>
